name: keep-alive

# Mantém o backend do Render acordado (o plano free hiberna após ~15 min de
# inatividade, causando ~50s de cold start em todas as telas). Este ping a cada
# ~10 min evita a hibernação. Também dá para usar um monitor externo
# (UptimeRobot / cron-job.org) apontando para /health — mais confiável.

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos (GitHub pode atrasar alguns min)
  workflow_dispatch: {}        # permite disparar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          for url in \
            "https://comex-backend-mcp7.onrender.com/health" ; do
            echo "Pinging $url"
            curl -fsS --max-time 90 "$url" || echo "ping falhou (backend pode estar acordando)"
          done
